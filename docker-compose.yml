services:
  observatory:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Supply your own game files here. Nothing copyrighted ships with this
      # repo. Writable, because the observatory's setup panel offers to fetch
      # them from the sources the research community uses — on a button press
      # and never on its own. `python tools/fetch_assets.py` does the same
      # thing from the host, if you would rather these stayed read-only.
      - ./roms:/app/roms
      # The map scan the chart is drawn on; also fetched on request.
      - ./assets:/app/assets
      - ./traces:/app/traces
      # A key pasted into the setup panel is written here, so it survives a
      # restart and a rebuild. Gitignored. Nothing else is kept in it.
      - ./.secrets:/app/.secrets
      # Live-edit the source without rebuilding.
      - ./src:/app/src
    environment:
      # Named without a value on purpose. That form passes the variable through
      # from .env or the host shell when it is set and OMITS IT ENTIRELY when it
      # is not — where `${VAR:-}` would define it as the empty string. An empty
      # ANTHROPIC_BASE_URL is worse than none: the SDK accepts it as the base
      # URL and then builds a request with no protocol, which surfaces as
      # "Connection error" and sends you looking at your network.
      #
      # Leave them all unset to run the free players; only `claude` needs any.
      # A key can also be pasted into the observatory's own setup panel, which
      # needs no restart. See .env.example.
      - ANTHROPIC_API_KEY
      # Alternatives for the same purpose: an OAuth bearer token, or a gateway
      # standing in for the API. Both are honoured by the SDK on their own.
      - ANTHROPIC_AUTH_TOKEN
      - ANTHROPIC_BASE_URL
      # Workload identity federation, for running this in CI or on a cloud VM:
      # the runner issues a short-lived OIDC token, the SDK trades it for an
      # access token, and no key is stored anywhere. Irrelevant on a desktop,
      # which has nothing to issue one — passed through so that a GitHub
      # Actions or cloud run needs no change here.
      - ANTHROPIC_FEDERATION_RULE_ID
      - ANTHROPIC_ORGANIZATION_ID
      - ANTHROPIC_IDENTITY_TOKEN
      - ANTHROPIC_IDENTITY_TOKEN_FILE
      - ANTHROPIC_WORKSPACE_ID
      # A named profile, if one exists on the host and is mounted in.
      - ANTHROPIC_PROFILE
      - ANTHROPIC_CONFIG_DIR
      # The local model server below. To use an Ollama installed on the host
      # instead, set OLLAMA_HOST=http://host.docker.internal:11434.
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["observatory", "serve", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # Local models, on the GPU. Free per token; pull models once with
  #   docker compose exec ollama ollama pull qwen3:8b
  # Weights live in a named volume, so they survive rebuilds.
  ollama:
    # Pinned to an exact version, never `latest`. Every arm on the roadmap is
    # compared against a baseline measured on one inference engine, and a tag
    # that moves under a rebuild would invalidate that comparison without
    # anyone noticing. Changing this line is changing the experiment: the
    # baseline has to be re-measured, and the version it was measured on
    # belongs in the write-up.
    #
    # 0.13.5 -> 0.35.0 on 1 October 2026, to share one daemon with ai-arcade,
    # which needs the /v1/systemone endpoint that 0.35 introduced.
    image: ollama/ollama:0.35.0
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      # One model in memory at a time; a consumer card rarely has room for two.
      - OLLAMA_MAX_LOADED_MODELS=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  ollama:
