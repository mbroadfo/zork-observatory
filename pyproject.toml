[project]
name = "zork-observatory"
version = "0.1.0"
description = "An instrument for watching agents play interactive fiction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "anthropic>=0.40",
]

[project.optional-dependencies]
# Jericho ships a compiled Frotz and is effectively Linux-only.
# On Windows, run the core in Docker or WSL2 (see docker/).
jericho = ["jericho>=3.3.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
observatory = "observatory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observatory"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
